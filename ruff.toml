# Narrow, high-signal lint gate (audit #43): Pyflakes correctness rules plus
# syntax errors. The codebase predates this gate; widening the rule set is
# welcome but must come with the fixes, not as warnings.
line-length = 100
target-version = "py310"

[lint]
select = ["F", "E9"]

[lint.per-file-ignores]
# Test fixtures may carry unused imports for patch targets.
"tests/*" = ["F401"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q tools tests

      - name: Validate skill registry
        run: python -m tools.skill_loader --validate

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Syntax-check the Electron shell
        run: node --check tools/wisp_shell/main.js

      - name: Test suite (offline; never calls the real agy)
        run: pytest tests/ -q

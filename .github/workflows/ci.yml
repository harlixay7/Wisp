name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node (Electron shell syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint (ruff)
        run: ruff check tools tests

      - name: Byte-compile everything
        run: python -m compileall -q tools tests

      - name: Validate skill registry
        run: python -m tools.skill_loader --validate

      - name: Node syntax check (Electron shell)
        run: node --check tools/wisp_shell/main.js

      - name: Test suite (deterministic; no real agy, no quota)
        env:
          ANTIGRAVITY_LIVE_REGISTRY: ${{ runner.temp }}/live-registry.json
        run: pytest tests/ -q

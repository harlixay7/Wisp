name: Bug report
description: Something in Wisp doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the widget with tools\antigravity_viewer.cmd
        2. ...
  - type: input
    id: version
    attributes:
      label: Wisp version or commit
      description: Output of `python tools/antigravity_bridge.py --status`, or the commit hash.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or report
      description: Relevant output, or the JSON report from .antigravity-reports/. Remove anything private first.
      render: text
